name: slipstream

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: slipstream
      POSTGRES_PASSWORD: slipstream
      POSTGRES_DB: slipstream
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U slipstream -d slipstream"]
      interval: 2s
      timeout: 2s
      retries: 15

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 2s
      timeout: 2s
      retries: 15

  # Scrapes the API's /metrics; open http://localhost:9090 to query it.
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    # Docker Desktop defines host.docker.internal itself; Linux needs it mapped to the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/ready"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  postgres-data:
  prometheus-data:
