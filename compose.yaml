name: slipstream

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: slipstream
      POSTGRES_PASSWORD: slipstream
      POSTGRES_DB: slipstream
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U slipstream -d slipstream"]
      interval: 2s
      timeout: 2s
      retries: 15

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  postgres-data:
