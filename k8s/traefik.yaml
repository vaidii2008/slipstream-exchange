# Settings for the Traefik that k3s installs itself: k3s merges these values into its own
# Helm chart, which is why this lives in kube-system.
#
# - Plain HTTP redirects to HTTPS. Let's Encrypt's HTTP challenge still gets through, because
#   Traefik answers it on port 80 itself, ahead of any redirect.
# - Certificates are kept on a volume. Without one they would be requested again every time
#   Traefik restarts, and Let's Encrypt limits how often a name can be issued.
# - Traefik requests certificates the moment it starts, about 7 s before its readiness probe
#   passes, and a Service sends nothing to an unready pod: Let's Encrypt's call back to port
#   80 timed out, every time Traefik restarted. So its Service publishes the pod unready.
# - Recreate, not a rolling update, so that unready pod is never beside an old one that would
#   answer the challenge 404 (staging's first attempt failed so). One pod, always.
# - Production Let's Encrypt. Staging proved this setup first (commit history), then had to
#   go: Traefik requests no certificate for a name it already holds one for, from any
#   resolver, so staging's stored certificates kept production from asking.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    ports:
      web:
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
    service:
      spec:
        publishNotReadyAddresses: true
    updateStrategy:
      type: Recreate
      rollingUpdate: null
    persistence:
      enabled: true
      storageClass: local-path
    certificatesResolvers:
      letsencrypt:
        acme:
          storage: /data/acme.json
          httpChallenge:
            entryPoint: web
