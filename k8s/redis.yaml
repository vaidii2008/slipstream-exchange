# Redis 7 with persistence off, as in compose.yaml: it holds pub/sub fan-out and rate-limit
# windows, nothing the exchange cannot lose. So a Deployment and no volume.
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: slipstream
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: slipstream
spec:
  replicas: 1
  # Two Redis pods side by side would split the API's subscribers between them for a moment.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--save", "", "--appendonly", "no"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 256Mi
